<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#1e293b' } // Deeper slate for contrast
                    },
                    boxShadow: {
                        'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04)',
                        'glow': '0 0 20px rgba(99, 102, 241, 0.15)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900" x-data="projectDashboard()">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass border-b border-slate-200/60">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center text-white font-bold shadow-lg shadow-slate-200">A</div>
                <h1 class="text-lg font-bold tracking-tight text-slate-900">Antigravity<span class="text-slate-400 font-normal">.projects</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-[10px] font-medium text-slate-400 uppercase tracking-widest">
                    Last Sync: <span class="text-slate-700 font-mono" x-text="lastUpdated"></span>
                </div>
            </div>
        </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-10 space-y-10">
        
        <!-- Header & Controls -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-white p-3 rounded-2xl border border-slate-200/60 shadow-sm">
            <div class="flex items-center gap-4 w-full md:w-auto flex-1">
                <h2 class="text-lg font-bold text-slate-900 tracking-tight whitespace-nowrap pl-1">Dashboard</h2>
                <div class="relative w-full max-w-md group">
                    <input type="text" x-model="search" placeholder="Search projects..." 
                        class="pl-9 pr-3 py-1.5 w-full bg-slate-50 border-0 ring-1 ring-slate-200 rounded-lg text-xs font-medium focus:ring-2 focus:ring-indigo-500/20 transition-all placeholder:text-slate-400 text-slate-700">
                    <svg class="absolute left-3 top-2 h-3.5 w-3.5 text-slate-400 group-focus-within:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>

            <div class="flex gap-1.5 overflow-x-auto w-full md:w-auto scrollbar-hide items-center justify-end">
                <button @click="filterType = 'All'" 
                    :class="filterType === 'All' ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50'"
                    class="px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all whitespace-nowrap uppercase tracking-wider">
                    All
                </button>
                <template x-for="type in uniqueTypes" :key="type">
                    <button @click="filterType = type" 
                        :class="filterType === type ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50'"
                        class="px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all whitespace-nowrap uppercase tracking-wider"
                        x-text="type">
                    </button>
                </template>
            </div>
        </div>

        <!-- Filter Tags Panel -->
        <div class="bg-white rounded-2xl p-6 shadow-soft ring-1 ring-slate-100 transition-all duration-500" 
             x-show="filterType === 'All' && !search.includes('tag:')">
            
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Interactive Filters</h3>
                <span class="text-[10px] text-slate-400 bg-slate-50 px-2 py-1 rounded-md">Select tags to refine view</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Group 1: AI -->
                <div class="space-y-3">
                   <div class="flex items-center gap-2 text-indigo-600 mb-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        <span class="text-xs font-bold uppercase tracking-wider">Models</span>
                   </div>
                   <div class="flex flex-wrap gap-2">
                        <button @click="toggleTag('e-Gov API')" :class="activeTags.includes('e-Gov API') ? 'bg-indigo-600 text-white ring-2 ring-indigo-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-indigo-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">e-Gov API</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Google GenAI (Imagen 3)')" :class="activeTags.includes('Google GenAI (Imagen 3)') ? 'bg-indigo-600 text-white ring-2 ring-indigo-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-indigo-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Google GenAI (Imagen 3)</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Google GenAI (Gemini Vision)')" :class="activeTags.includes('Google GenAI (Gemini Vision)') ? 'bg-indigo-600 text-white ring-2 ring-indigo-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-indigo-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Google GenAI (Gemini Vision)</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Google GenAI (Gemini 2.5 Flash)')" :class="activeTags.includes('Google GenAI (Gemini 2.5 Flash)') ? 'bg-indigo-600 text-white ring-2 ring-indigo-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-indigo-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Google GenAI (Gemini 2.5 Flash)</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Google Search Grounding')" :class="activeTags.includes('Google Search Grounding') ? 'bg-indigo-600 text-white ring-2 ring-indigo-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-indigo-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Google Search Grounding</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Gemini Pro')" :class="activeTags.includes('Gemini Pro') ? 'bg-indigo-600 text-white ring-2 ring-indigo-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-indigo-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Gemini Pro</span><span class="opacity-40 text-[9px]">1</span></button>
                   </div>
                </div>

                <!-- Group 2: Output -->
                <div class="space-y-3">
                   <div class="flex items-center gap-2 text-emerald-600 mb-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                        <span class="text-xs font-bold uppercase tracking-wider">Outputs</span>
                   </div>
                    <div class="flex flex-wrap gap-2">
                        <button @click="toggleTag('Web App')" :class="activeTags.includes('Web App') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Web App</span><span class="opacity-40 text-[9px]">2</span></button><button @click="toggleTag('Project Dashboard (HTML)')" :class="activeTags.includes('Project Dashboard (HTML)') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Project Dashboard (HTML)</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('X (Twitter) Post')" :class="activeTags.includes('X (Twitter) Post') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">X (Twitter) Post</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Research Report (Markdown)')" :class="activeTags.includes('Research Report (Markdown)') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Research Report (Markdown)</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Web Dashboard')" :class="activeTags.includes('Web Dashboard') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Web Dashboard</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Generated Images (Files)')" :class="activeTags.includes('Generated Images (Files)') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Generated Images (Files)</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Web App (Vercel)')" :class="activeTags.includes('Web App (Vercel)') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Web App (Vercel)</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Note.com Article')" :class="activeTags.includes('Note.com Article') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Note.com Article</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Mobile Game (iOS)')" :class="activeTags.includes('Mobile Game (iOS)') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Mobile Game (iOS)</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('JSON Data')" :class="activeTags.includes('JSON Data') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">JSON Data</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Web Demo')" :class="activeTags.includes('Web Demo') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Web Demo</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('MP4 Video')" :class="activeTags.includes('MP4 Video') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">MP4 Video</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Web Page')" :class="activeTags.includes('Web Page') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Web Page</span><span class="opacity-40 text-[9px]">1</span></button><button @click="toggleTag('Console Output')" :class="activeTags.includes('Console Output') ? 'bg-emerald-600 text-white ring-2 ring-emerald-200 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-emerald-600 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Console Output</span><span class="opacity-40 text-[9px]">1</span></button>
                   </div>
                </div>

                <!-- Group 3: Tech -->
                <div class="space-y-3">
                   <div class="flex items-center gap-2 text-slate-500 mb-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        <span class="text-xs font-bold uppercase tracking-wider">Tech Stack</span>
                   </div>
                    <div class="flex flex-wrap gap-2">
                        <button @click="toggleTag('Python')" :class="activeTags.includes('Python') ? 'bg-slate-700 text-white ring-2 ring-slate-400 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-slate-800 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Python</span><span class="opacity-40 text-[9px]">5</span></button><button @click="toggleTag('React')" :class="activeTags.includes('React') ? 'bg-slate-700 text-white ring-2 ring-slate-400 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-slate-800 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">React</span><span class="opacity-40 text-[9px]">5</span></button><button @click="toggleTag('TypeScript')" :class="activeTags.includes('TypeScript') ? 'bg-slate-700 text-white ring-2 ring-slate-400 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-slate-800 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">TypeScript</span><span class="opacity-40 text-[9px]">4</span></button><button @click="toggleTag('Next.js')" :class="activeTags.includes('Next.js') ? 'bg-slate-700 text-white ring-2 ring-slate-400 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-slate-800 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Next.js</span><span class="opacity-40 text-[9px]">3</span></button><button @click="toggleTag('Tailwind')" :class="activeTags.includes('Tailwind') ? 'bg-slate-700 text-white ring-2 ring-slate-400 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-slate-800 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Tailwind</span><span class="opacity-40 text-[9px]">3</span></button><button @click="toggleTag('Vite')" :class="activeTags.includes('Vite') ? 'bg-slate-700 text-white ring-2 ring-slate-400 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-slate-800 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Vite</span><span class="opacity-40 text-[9px]">2</span></button><button @click="toggleTag('Framer Motion')" :class="activeTags.includes('Framer Motion') ? 'bg-slate-700 text-white ring-2 ring-slate-400 shadow-md' : 'bg-slate-50 text-slate-600 hover:bg-white hover:shadow-sm hover:text-slate-800 ring-1 ring-slate-100'" class="inline-flex items-center px-2.5 py-1.5 rounded-lg text-xs font-medium transition-all duration-200"><span class="mr-1.5">Framer Motion</span><span class="opacity-40 text-[9px]">2</span></button>
                   </div>
                </div>
            </div>
        </div>
        
        <!-- Active Tags -->
        <div x-show="activeTags.length > 0" class="flex items-center gap-3 animate-fade-in" x-cloak>
            <div class="text-xs font-bold text-slate-900">Active Filters:</div>
            <div class="flex flex-wrap gap-2">
                <template x-for="tag in activeTags" :key="tag">
                    <button @click="toggleTag(tag)" class="group inline-flex items-center pl-2.5 pr-1 py-1 rounded-full text-xs font-medium bg-slate-800 text-white shadow-md hover:bg-slate-700 transition">
                        <span x-text="tag"></span>
                        <span class="ml-1.5 p-0.5 rounded-full bg-slate-700 group-hover:bg-slate-600 text-slate-300 group-hover:text-white">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </span>
                    </button>
                </template>
                <button @click="activeTags = []" class="px-2 py-1 text-xs text-slate-500 hover:text-indigo-600 transition font-medium border-b border-transparent hover:border-indigo-600 ml-1">Clear All</button>
            </div>
        </div>

        <!-- Projects Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            <template x-for="project in filteredProjects" :key="project.dir_name">
                <div class="bg-white rounded-2xl p-0 ring-1 ring-slate-200/60 shadow-sm hover:shadow-xl hover:ring-indigo-500/20 hover:-translate-y-1 transition-all duration-300 flex flex-col overflow-hidden group h-full">
                    
                    <!-- Card Top -->
                    <div class="p-6 pb-2">
                        <div class="flex justify-between items-start mb-4">
                             <div class="flex gap-2">
                                 <!-- Status -->
                                 <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ring-1 ring-inset"
                                     :class="getStatusColor(project.status)">
                                     <span class="mr-1.5 w-1.5 h-1.5 rounded-full bg-current opacity-70"></span>
                                     <span x-text="project.status"></span>
                                 </span>
                             </div>
                             <div class="text-[10px] text-slate-400 font-mono bg-slate-50 px-2 py-1 rounded" x-text="project.last_modified"></div>
                        </div>

                        <div class="flex justify-between items-start gap-4 mb-2">
                             <h3 class="text-lg font-bold text-slate-900 group-hover:text-indigo-600 transition-colors leading-tight tracking-tight" x-text="project.name"></h3>
                             <a :href="'file://' + project.path" class="text-slate-300 hover:text-indigo-600 transition-colors p-1 rounded-lg hover:bg-indigo-50 shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                             </a>
                        </div>
                        <p class="text-slate-500 text-sm leading-relaxed mb-4 h-[3rem] line-clamp-2" x-text="project.description || 'No description available.'"></p>
                    </div>

                    <!-- Tech Grid -->
                    <div class="flex-1 px-6 py-4 bg-slate-50/50 border-t border-slate-100/60 space-y-4">
                        
                        <!-- AI & Output Row -->
                        <div class="grid grid-cols-2 gap-4">
                            <!-- AI -->
                            <div x-show="project.api && project.api.length > 0">
                                <h4 class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-2">AI Models</h4>
                                <div class="flex flex-col gap-1.5">
                                    <template x-for="item in project.api" :key="item">
                                        <span class="text-xs font-medium text-slate-700 truncate border-l-2 border-indigo-400 pl-2" x-text="item"></span>
                                    </template>
